<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design preview</title>
<link rel="stylesheet" href="assets/base.css">
<script src="assets/garments.js"></script>
<script src="assets/pets.js"></script>
<style>
/* The sample website drawn by the JIEWEITECH Design Studio. Every choice arrives as a CSS variable or a class on <html>. */
:root{--bg:#fff;--sf:#f4f4f5;--ink:#18181b;--mut:#6b6b72;--line:rgba(0,0,0,.12);--pri:#1d4ed8;--on:#fff;--acc:#f59e0b;--r:10px;--rb:10px;--hf:"Inter V";--bf:"Inter V";--hw:750;--hst:100%;--hls:-.03em;--hsc:1;--bs:16px;--pad:96px;--spd:1}
html{background:var(--bg);color:var(--ink);font-family:var(--bf),Arial,sans-serif;font-size:var(--bs);scroll-behavior:smooth}
body{background:var(--bg);overflow-x:hidden;transition:background .4s,color .4s}
.h{font-family:var(--hf),Arial,sans-serif;font-weight:var(--hw);font-stretch:var(--hst);letter-spacing:var(--hls);line-height:1;text-wrap:balance}
html.upper .h{text-transform:uppercase;letter-spacing:max(var(--hls),0em)}
.mono{font-family:"JetBrains Mono V",monospace}
.c{width:min(1200px,100% - 48px);margin:0 auto}
img,svg{display:block}
/* header */
.hd{position:relative;z-index:20;background:var(--bg);transition:padding .3s,box-shadow .3s,background .4s}
html.sticky .hd{position:sticky;top:0}
html.sticky .hd.small{box-shadow:0 1px 0 var(--line),0 10px 30px rgba(0,0,0,.06)}
.hd .c{display:flex;align-items:center;gap:26px;height:76px;transition:height .3s}
.hd.small .c{height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:calc(var(--r) * .7);background:var(--pri);color:var(--on);display:grid;place-items:center;font-style:normal;font-size:15px;font-family:var(--hf);font-weight:800}
.links{display:flex;gap:24px;font-weight:600;font-size:14.5px;margin-left:auto}
.links a{position:relative;opacity:.85;white-space:nowrap}
.tools{display:flex;align-items:center;gap:12px}
.lng{font-size:12.5px;font-weight:700;opacity:.7;border:1px solid var(--line);border-radius:var(--rb);padding:6px 8px;white-space:nowrap}
.cart{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.cart b{position:absolute;right:-4px;top:-4px;background:var(--acc);color:#111;font-size:10px;border-radius:99px;padding:1px 5px}
.burger{width:40px;height:40px;border-radius:var(--rb);border:1px solid var(--line);display:none;place-items:center}
.burger::before{content:"";width:16px;height:10px;border-block:2px solid currentColor;box-shadow:inset 0 4px 0 -2px transparent;background:linear-gradient(currentColor,currentColor) center/100% 2px no-repeat}
html.nav-center .hd .c{display:grid;grid-template-columns:1fr auto 1fr}
html.nav-center .links{margin:0;justify-content:flex-start;order:-1}
html.nav-center .logo{justify-self:center}
html.nav-center .tools{justify-self:end}
html.nav-minimal .links{display:none}
html.nav-minimal .burger{display:grid}
html.nav-minimal .tools{margin-left:auto}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:var(--rb);font-weight:700;font-size:15px;white-space:nowrap;transition:transform .3s,box-shadow .3s,background .3s}
.btn.p{background:var(--pri);color:var(--on)}
.btn.s{border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{height:42px;padding:0 18px;font-size:14px}
/* hero */
.hero{position:relative;overflow:hidden}
.hero .c{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;min-height:min(78vh,720px);padding:56px 0 calc(var(--pad) * .8)}
.ey{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pri)}
.ey::before{content:"";width:22px;height:2px;background:currentColor}
.hero h1{font-size:calc(clamp(40px,5.4vw,76px) * var(--hsc));margin:18px 0 20px}
.hero p.l{font-size:1.12rem;line-height:1.6;color:var(--mut);max-width:30em}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .proof{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap}
.hero .proof b{display:block;font-family:var(--hf);font-size:24px;font-weight:var(--hw)}
.hero .proof small{color:var(--mut);font-size:13px}
.vis{position:relative;aspect-ratio:1;max-height:560px;width:100%;justify-self:center}
.panel{position:absolute;inset:4%;border-radius:calc(var(--r) * 2.4);background:var(--sf);overflow:hidden}
.panel.tint{background:color-mix(in srgb,var(--pri) 14%,var(--sf))}
.vis .art{position:absolute;inset:12%}
.vis .art svg{width:100%;height:100%}
.chip{position:absolute;background:var(--bg);color:var(--ink);border-radius:calc(var(--r) * 1.2);padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.14);display:flex;gap:10px;align-items:center;white-space:nowrap}
.chip i{font-style:normal;width:30px;height:30px;border-radius:calc(var(--r) * .8);background:var(--acc);display:grid;place-items:center;color:#111;font-size:14px}
.chip small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.chip.a{left:0;top:16%}.chip.b{right:0;bottom:14%}
.scene .s1{position:absolute;left:4%;top:10%;width:52%;aspect-ratio:1;border-radius:calc(var(--r) * 2);background:var(--sf)}
.scene .s2{position:absolute;right:4%;top:30%;width:46%;aspect-ratio:.8;border-radius:calc(var(--r) * 2);background:color-mix(in srgb,var(--acc) 30%,var(--sf))}
.scene .s3{position:absolute;left:22%;bottom:4%;width:42%;aspect-ratio:1.1;border-radius:calc(var(--r) * 2);background:color-mix(in srgb,var(--pri) 18%,var(--sf))}
.scene .s1 svg,.scene .s2 svg,.scene .s3 svg{position:absolute;inset:10%;width:80%;height:80%}
.abs .o{position:absolute;border-radius:50%;filter:blur(0)}
.abs .o1{width:70%;aspect-ratio:1;left:4%;top:8%;background:var(--pri)}
.abs .o2{width:46%;aspect-ratio:1;right:4%;bottom:6%;background:var(--acc);mix-blend-mode:multiply}
html.dark .abs .o2{mix-blend-mode:screen}
.abs .o3{width:26%;aspect-ratio:1;right:24%;top:10%;border:3px solid var(--ink);opacity:.5}
.abs .grid{position:absolute;inset:0;background-image:radial-gradient(var(--ink) 1.2px,transparent 1.3px);background-size:22px 22px;opacity:.18}
/* hero layouts */
html.hero-center .hero .c{grid-template-columns:1fr;text-align:center;justify-items:center;min-height:auto;padding-top:72px}
html.hero-center .hero p.l{margin:0 auto}
html.hero-center .hero .acts,html.hero-center .hero .proof{justify-content:center}
html.hero-center .hero h1{max-width:14em}
html.hero-center .vis{aspect-ratio:2.2;max-height:none;max-width:1000px}
html.hero-center .vis .art{inset:8% 30%}
html.hero-full .hero{background:var(--pri);color:var(--on)}
html.hero-full .hero .c{grid-template-columns:1fr;min-height:min(86vh,760px);align-content:end}
html.hero-full .hero .vis{position:absolute;right:-4%;top:0;bottom:0;width:58%;max-height:none;aspect-ratio:auto;opacity:.95}
html.hero-full .hero .vis .panel{inset:0;border-radius:0;background:color-mix(in srgb,var(--on) 10%,transparent)}
html.hero-full .hero .txt{max-width:640px;position:relative;z-index:2}
html.hero-full .hero p.l,html.hero-full .hero .proof small{color:color-mix(in srgb,var(--on) 78%,transparent)}
html.hero-full .ey{color:var(--on)!important}
html.hero-full .hero .btn.p{background:var(--on);color:var(--pri)}
html.hero-full .hero .btn.s{border-color:color-mix(in srgb,var(--on) 45%,transparent);color:var(--on)}
html.hero-full .hero .chip{display:none}
html.hero-editorial .hero .c{grid-template-columns:1.5fr 1fr;align-items:end;gap:36px}
html.hero-editorial .hero h1{font-size:calc(clamp(48px,7.4vw,112px) * var(--hsc));line-height:.92}
html.hero-editorial .hero .vis{aspect-ratio:.78}
html.hero-editorial .hero .vis .panel{inset:0;border-radius:var(--r)}
html.hero-editorial .hero .txt{border-top:2px solid var(--ink);padding-top:20px}
html.vis-type .hero .vis{display:none}
html.vis-type .hero .c{grid-template-columns:1fr}
html.vis-type .hero h1{font-size:calc(clamp(52px,8.4vw,128px) * var(--hsc));max-width:12em}
/* decoration */
.deco{position:absolute;inset:0;pointer-events:none}
html.deco-dots .deco{background-image:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) 1.3px,transparent 1.4px);background-size:24px 24px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
html.deco-lines .deco{background-image:linear-gradient(color-mix(in srgb,var(--ink) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 8%,transparent) 1px,transparent 1px);background-size:64px 64px}
html.deco-blobs .deco::before,html.deco-blobs .deco::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
html.deco-blobs .deco::before{width:420px;height:420px;background:var(--pri);left:-120px;top:-80px}
html.deco-blobs .deco::after{width:360px;height:360px;background:var(--acc);right:-80px;bottom:-60px}
/* sections */
.sec{padding:var(--pad) 0}
.sec.alt{background:var(--sf)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.sh h2{font-size:calc(clamp(32px,3.6vw,52px) * var(--hsc));max-width:15em}
.sh p{color:var(--mut);max-width:28em;line-height:1.6}
.marq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:20px 0;font-family:var(--hf);font-weight:var(--hw);font-size:20px;color:var(--mut)}
.marq div{display:inline-flex;gap:56px;padding-right:56px}
html.marquee .marq div{animation:mq calc(28s / var(--spd)) linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips span{border:1px solid var(--line);border-radius:var(--rb);padding:8px 14px;font-size:13.5px;font-weight:600}
.chips span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:18px}
.card{border-radius:var(--r);overflow:hidden;transition:transform .35s,box-shadow .35s,border-color .35s;position:relative}
html.cards-flat .card{background:var(--sf)}
html.cards-flat .sec.alt .card{background:var(--bg)}
html.cards-outline .card{border:1px solid var(--line)}
html.cards-shadow .card{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.08)}
html.cards-glass .card{background:color-mix(in srgb,var(--sf) 55%,transparent);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);backdrop-filter:blur(14px)}
.card .pic{aspect-ratio:1.1;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 8%,var(--sf));margin:10px;border-radius:calc(var(--r) * .8)}
html.cards-outline .card .pic,html.cards-glass .card .pic{background:color-mix(in srgb,var(--pri) 8%,transparent)}
.card .pic svg{width:72%;height:72%}
.card .meta{padding:6px 18px 20px}
.card .meta b{display:block;font-size:16.5px;margin-bottom:4px}
.card .meta small{color:var(--mut);font-size:13.5px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.card .price{font-weight:800;font-size:17px}
.card .add{font-size:13px;font-weight:700;color:var(--pri);border:1.5px solid currentColor;border-radius:var(--rb);padding:7px 12px}
.tag{position:absolute;left:20px;top:20px;background:var(--acc);color:#111;font-size:11.5px;font-weight:800;border-radius:var(--rb);padding:4px 9px;letter-spacing:.04em}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.why div{padding:28px;border-radius:var(--r)}
html.cards-flat .why div{background:var(--bg)}
html.cards-outline .why div,html.cards-glass .why div{border:1px solid var(--line)}
html.cards-shadow .why div{background:var(--bg);box-shadow:0 14px 34px rgba(0,0,0,.07)}
.why i{display:grid;place-items:center;width:46px;height:46px;border-radius:calc(var(--r) * .8);background:var(--pri);color:var(--on);font-style:normal;font-size:20px;margin-bottom:22px}
.why h3{font-size:22px;margin-bottom:8px}
.why p{color:var(--mut);line-height:1.6;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
.stats b{display:block;font-family:var(--hf);font-weight:var(--hw);font-size:calc(46px * var(--hsc));color:var(--pri)}
.stats small{color:var(--mut)}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.revs div{border-radius:var(--r);padding:26px;border:1px solid var(--line)}
.revs .st{color:var(--acc);letter-spacing:2px}
.revs p{line-height:1.6;margin:12px 0 18px}
.revs small{color:var(--mut)}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.news .im{aspect-ratio:1.6;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 40%,var(--sf)),color-mix(in srgb,var(--acc) 40%,var(--sf)));margin-bottom:14px}
.news small{color:var(--mut);font-size:13px}
.news b{display:block;font-size:18px;margin-top:6px;line-height:1.3}
.form{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:start}
.form .fs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:28px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line)}
.form .fs label{display:grid;gap:6px;font-size:13px;font-weight:600}
.form .fs span.in{height:46px;border-radius:calc(var(--r) * .6);border:1px solid var(--line);background:var(--sf)}
.form .fs .w{grid-column:1/-1}
.form .fs span.ta{height:96px}
.form ul{display:grid;gap:12px;margin-top:22px}
.form li{display:flex;gap:10px;align-items:center;color:var(--mut)}
.form li::before{content:"✓";color:var(--pri);font-weight:800}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;border-radius:calc(var(--r) * 1.6);background:var(--sf);padding:36px}
.cfg .sw{display:flex;gap:8px;margin:18px 0}
.cfg .sw i{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.cfg .pic{aspect-ratio:1.2;display:grid;place-items:center}
.cfg .pic svg{width:70%;height:90%}
.nl{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:36px;border-radius:calc(var(--r) * 1.6);background:var(--pri);color:var(--on)}
.nl h3{font-size:30px}
.nl .in{display:flex;gap:8px;background:var(--bg);border-radius:var(--rb);padding:6px;min-width:min(380px,100%)}
.nl .in span{flex:1;color:var(--mut);padding:10px 12px;font-size:14px}
.cta{text-align:center;padding:calc(var(--pad) * 1.1) 0}
.cta h2{font-size:calc(clamp(36px,4.6vw,68px) * var(--hsc));max-width:13em;margin:0 auto 26px}
.ft{background:var(--ink);color:var(--bg);padding:56px 0 30px;font-size:14px}
.ft .c{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px}
.ft b{display:block;margin-bottom:12px}
.ft a{display:block;opacity:.7;margin:6px 0}
.ft .logo i{background:var(--acc);color:#111}
.ft .bot{grid-column:1/-1;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);padding-top:20px;margin-top:20px;display:flex;justify-content:space-between;opacity:.6;font-size:13px;flex-wrap:wrap;gap:10px}
.wa{position:fixed;right:20px;bottom:20px;z-index:30;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.wa svg{width:28px}
.map{aspect-ratio:2.6;border-radius:var(--r);background:var(--sf);position:relative;overflow:hidden;background-image:linear-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 2px,transparent 2px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 7%,transparent) 2px,transparent 2px);background-size:46px 46px}
.map i{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pri);border:4px solid var(--bg);box-shadow:0 6px 14px rgba(0,0,0,.2)}
/* hover effects */
html.hv-lift .card:hover,html.hv-lift .why div:hover{transform:translateY(-6px)}
html.hv-lift .btn:hover{transform:translateY(-2px)}
html.hv-glow .card:hover{box-shadow:0 0 0 2px var(--pri),0 18px 40px color-mix(in srgb,var(--pri) 30%,transparent)}
html.hv-glow .btn.p:hover{box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 55%,transparent)}
html.hv-underline .links a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--pri);transform:scaleX(0);transform-origin:left;transition:transform .3s}
html.hv-underline .links a:hover::after{transform:none}
html.hv-underline .card:hover .meta b{text-decoration:underline;text-underline-offset:4px}
/* entrance motion */
[data-a]{transition:opacity calc(.8s / var(--spd)) cubic-bezier(.16,1,.3,1),transform calc(.9s / var(--spd)) cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0) * 80ms / var(--spd))}
html.en-fade [data-a]:not(.in){opacity:0}
html.en-rise [data-a]:not(.in){opacity:0;transform:translateY(40px)}
html.en-zoom [data-a]:not(.in){opacity:0;transform:scale(.92)}
html.en-slide [data-a]:not(.in){opacity:0;transform:translateX(-50px)}
html.parallax .hero .vis{will-change:transform}
/* responsive (the preview really changes width for tablet and phone) */
@media (max-width:980px){.hero .c,html.hero-editorial .hero .c{grid-template-columns:1fr}.vis{max-width:520px}.why,.revs,.news{grid-template-columns:1fr 1fr}.form,.cfg{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{--cols:2!important}.links{display:none}.burger{display:grid}.tools{margin-left:auto}html.nav-center .hd .c{grid-template-columns:auto 1fr}html.nav-center .logo{justify-self:start}html.hero-full .hero .vis{width:100%;opacity:.25}.ft .c{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.c{width:calc(100% - 32px)}.why,.revs,.news,.form .fs{grid-template-columns:1fr}.hero .c{padding-top:28px;gap:28px}.hero .acts .btn{flex:1;justify-content:center}.lng{display:none}.nl,.cfg{padding:24px}.chip{display:none}.sh h2{font-size:calc(30px * var(--hsc))}.grid{gap:10px}.card .meta{padding:4px 12px 14px}.card .row{flex-direction:column;align-items:flex-start;gap:8px}.hd .btn{display:none}}
</style>
</head>

  /* ---------- motion ---------- */
  var io;
  function observe(S) {
    if (io) io.disconnect();
    var els = document.querySelectorAll("[data-a]");
    if (S.enter === "none") { els.forEach(function (e) { e.classList.add("in"); }); }
    else {
      io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); if (S.scroll && S.scroll.counters) count(e.target); } }); }, { threshold: 0.12 });
      els.forEach(function (e) { io.observe(e); });
    }
    if (S.enter === "none" && S.scroll && S.scroll.counters) document.querySelectorAll(".stats [data-a]").forEach(count);
  }
  function count(el) {
    var b = el.querySelector("[data-count]"); if (!b) return;
    var raw = b.getAttribute("data-count"), m = raw.match(/^([^\d]*)([\d,.]+)(.*)$/); if (!m) return;

    (function step(t) { var k = Math.min(1, (t - t0) / dur), v = target * (1 - Math.pow(1 - k, 3)); b.textContent = m[1] + v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3]; if (k < 1) requestAnimationFrame(step); })(t0);
  }
  addEventListener("scroll", function () {

    if (document.documentElement.classList.contains("parallax")) { var v = document.querySelector(".hero .vis"); if (v) v.style.transform = "translateY(" + scrollY * 0.18 + "px)"; }
  }, { passive: true });

    render: function (S) { last = S; render(S); },
    replay: function () { if (!last) return; window.scrollTo(0, 0); render(last); },

  };
  if (window.parent && window.parent !== window) { try { window.parent.postMessage({ studioPreviewReady: true }, location.origin); } catch (e) {} }
})();
